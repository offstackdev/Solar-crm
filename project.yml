name: SolarCRM
options:
  bundleIdPrefix: com.suncrest
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: com.suncrest.solarcrm
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SolarCRM:
    type: application
    platform: iOS
    sources:
      - SolarCRMApp
    settings:
      base:
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Solar CRM
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        GENERATE_INFOPLIST_FILE: YES
    dependencies: []

schemes:
  SolarCRM:
    build:
      targets:
        SolarCRM: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
